<!-- The done tab of the page (#4656). maxpm serve puts it into index.html, at view: done. -->
<section id="tab-done" class="hidden">
  <div class="grid">
    <div class="panel">
      <h2>Completed work <span class="spacer"></span>
        <select id="logProject"><option value="">All projects</option></select>
        <select id="logSince"><option value="1d">last day</option><option value="7d" selected>last 7 days</option><option value="30d">last 30 days</option><option value="all">all time</option></select>
      </h2>
      <div id="log"></div>
    </div>
    <div class="panel"><h2>Progress per project</h2><div id="progress"></div></div>
  </div>
</section>
