<!-- The Done view of Plan (#4656; Plan since #5102 step 4): what was finished in the scope, by day, and progress.
     maxpm serve puts it into plan.html, at view: done. -->
<div id="plan-done" class="plan-view hidden">
  <div class="grid">
    <div class="panel">
      <h2><span class="spacer"></span>
        <select id="logSince"><option value="1d">last day</option><option value="7d" selected>last 7 days</option><option value="30d">last 30 days</option><option value="all">all time</option><option value="archived">all time, with archived</option></select>
      </h2>
      <div id="log"></div>
    </div>
    <div>
      <div class="panel"><h2>Progress</h2><div id="progress"></div></div>
      <!-- Recent (the Board's, #5102 step 5): the last changes to the queue, folded closed. -->
      <details class="panel recent"><summary>Recent changes</summary><div id="events"></div></details>
    </div>
  </div>
</div>
