<!-- The board tab of the page (#4656). maxpm serve puts it into index.html, at view: board. -->
<section id="tab-board">
  <div class="strip" id="strip"></div>
  <div class="dash">
    <div class="col" id="colNeeds">
  <div class="panel hidden" id="takeoverPanel">
    <div id="takeovers"></div>
  </div>
  <div class="panel hidden" id="needsYouPanel">
    <h2>Needs you <span class="spacer"></span><button class="btn" id="copyAll" title="Copy one prompt for an agent that walks you through all of these">Copy prompt</button><span id="agentAllSlot"></span><button class="btn hidden" id="notifyOn" title="Turn on browser notifications">Notify me</button></h2>
    <div id="needsYou"></div>
  </div>
      <div class="panel muted hidden t-m" id="nothingForYou">Nothing waits on you now.</div>
  <div class="panel hidden" id="inboxPanel" data-more-area="inbox">
    <h2><span id="inboxTitle">Inbox</span> <span class="spacer"></span><label class="sub"><input type="checkbox" id="inboxAll"> show read</label></h2>
    <div id="inbox"></div>
    <div class="actions send-row">
      <select id="sendKind"><option value="note">note</option><option value="question">question</option><option value="alert">alert</option></select>
      <select id="sendTo"></select>
      <input id="sendItem" placeholder="or item #">
      <input id="sendBody" placeholder="message">
      <button class="btn" id="sendGo">Send</button>
    </div>
  </div>
    </div>
    <div class="col" id="colWork">
      <div class="panel">
        <h2>Next up
          <span class="spacer"></span>
          <select id="area"><option value="">All projects</option><option value="__mine">Near my earlier work</option></select>
          <button class="btn primary" id="claimNext">Claim next</button>
          <label class="muted claim-agent" title="After you claim, open an agent in the item's project folder that helps you do it"><input type="checkbox" id="claimAgent" checked>with an agent</label>
        </h2>
        <div id="next"></div>
      </div>
      <!-- Less text (#5083): Needs you and Next up first; each other area shows when its name here is chosen. -->
      <div class="board-more" id="boardMore"></div>
      <div class="panel" id="workPanel" data-more-area="work">
        <h2>Work <span class="spacer"></span><span class="link" data-tab="projects" style="text-transform:none;letter-spacing:0">all items</span></h2>
        <div id="work"></div>
      </div>
    </div>
    <div class="col" id="colAgents">
      <div class="panel" id="managerPanel" data-more-area="manager"><h2>Manager</h2><div id="manager"></div></div>
      <div class="panel" id="agentsPanel" data-more-area="agents"><h2>Agents <span class="spacer"></span><button class="btn hidden" id="tidyPanes" style="text-transform:none;letter-spacing:0"></button><label class="sub hidden" id="showIdleWrap"><input type="checkbox" id="showIdle"> <span id="showIdleText"></span></label></h2><div id="agents"></div>
        <details class="reg-details"><summary>Register an agent or person</summary>
          <div class="form">
            <div class="two"><input id="regName" placeholder="name"><label class="reg-human"><input type="checkbox" id="regHuman"> human</label></div>
            <input id="regNote" placeholder="note (optional)">
            <button class="btn" id="regGo">Register</button>
          </div>
        </details>
      </div>
      <div class="panel" id="recentPanel" data-more-area="recent"><h2>Recent</h2><div id="events"></div></div>
    </div>
  </div>
</section>
