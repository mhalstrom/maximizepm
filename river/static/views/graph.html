<!-- The graph tab of the page (#4656). maxpm serve puts it into index.html, at view: graph. -->
<section id="tab-graph" class="hidden">
  <div class="graph-layout">
  <aside class="panel graph-side" id="graphSide" aria-label="Choose a project"></aside>
  <div class="panel">
    <h2 title="Arrows point from a prerequisite to the item that waits on it. Green: ready. Yellow: in progress. A border in the people color: a person does it. Click a box to open it. Scroll or drag to move; pinch, the wheel, or + and − to zoom; Fit shows it all."><span id="graphTitle">All projects</span> <span class="spacer"></span>
      <label class="sub"><input type="checkbox" id="graphDone"> done</label>
    </h2>
    <div class="muted hidden t-s" id="graphNote" style="margin-bottom:var(--sp-3)"></div>
    <div id="graph"></div>
  </div>
  </div>
</section>
