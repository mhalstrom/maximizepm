<!-- The Graph view of Plan (#4656; Plan since #5102 step 4): the dependency graph of the scope. maxpm serve puts it
     into plan.html, at view: graph. -->
<div id="plan-graph" class="plan-view hidden">
  <div class="panel">
    <h2 class="graph-h" title="Arrows: from a prerequisite to its item"><span id="graphTitle">All projects</span> <span class="spacer"></span>
      <label class="sub"><input type="checkbox" id="graphDone"> done</label>
    </h2>
    <!-- The step bars (the Capacity tab's, #5102 step 5): how many open items can run in parallel at each step. -->
    <div class="graph-steps" id="graphSteps"></div>
    <div class="muted hidden t-s" id="graphNote"></div>
    <div id="graph"></div>
  </div>
</div>
