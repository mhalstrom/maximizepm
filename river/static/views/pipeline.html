<!-- The Pipelines view of Plan (#6116; canvas pipeline-mockup v2 of #6110): the stages of a pipeline left to right,
     the detail of a stage, where each version runs, the versions in each stage, and the test view with the prompt
     that analyzes the failures. maxpm serve puts it into plan.html, at view: pipeline. -->
<div id="plan-pipelines" class="plan-view hidden">
  <div class="panel pl-panel">
    <div class="pl-head">
      <span class="pl-pick" id="plPick" role="tablist" aria-label="Pipelines"></span>
      <span class="spacer"></span>
      <span class="pl-tabs" id="plTabs" role="tablist" aria-label="Pipeline views"></span>
    </div>
    <div class="muted t-s" id="plNote"></div>
    <div id="plBody"></div>
  </div>
</div>
