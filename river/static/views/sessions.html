<!-- The sessions tab of the page (#4656). maxpm serve puts it into index.html, at view: sessions. -->
<section id="tab-sessions" class="hidden">
  <div class="sess-layout" id="sessLayout">
    <aside class="panel sess-side" aria-label="Running sessions">
      <h2>Running sessions</h2>
      <div id="sessMgr" class="slist-mgr" aria-label="Manager"></div>
      <div id="sessExperts" class="slist-mgr slist-experts hidden" aria-label="Experts">
        <div class="slist-h">Experts</div>
        <div id="sessExpertRows" class="slist-rows"></div>
      </div>
      <div id="sessions" class="slist"></div>
      <div class="muted sess-note">Read from each session's transcript on this computer. To type in a session, use Open (its claude.ai/code page), or the message box of a session that runs in a tmux pane.</div>
    </aside>
    <div class="panel sess-main hidden" id="sessMain">
      <div class="sess-head">
        <button class="btn" type="button" id="sessBack" title="All running sessions" aria-label="All running sessions">‹<span class="sb-word"> Sessions</span></button>
        <h2 class="sess-h2"><span id="sessName"></span> <span id="sessTitle" class="sid" title="Its agent id: maxpm --as, messages and commands use it"></span></h2><span id="sessState"></span>
        <span class="spacer"></span><span id="sessOpen"></span>
        <button class="iconbtn" type="button" id="sessMore" aria-expanded="false" title="Its item, Settings, Open session, Items and Artifacts" aria-label="More of this session">⋯</button>
      </div>
      <div class="sess-item"><span id="sessItem"></span><span class="spacer"></span>
        <span class="sess-lists" aria-label="Open in the side panel">
          <button class="btn" type="button" data-sp-open="items" title="The items this session claimed, finished, released or gave away, in the side panel">Items</button>
          <button class="btn" type="button" data-sp-open="artifacts" title="The files, local pages and claude.ai artifact links this session wrote or named, in the side panel">Artifacts</button>
        </span></div>
      <div id="sessBody" class="sbody"><div id="sessCol" class="chat-col"></div></div>
      <div class="chat-col chat-foot">
        <div id="sessWait" class="sess-wait hidden"></div>
        <div id="sessBarWhy" class="muted sess-why hidden"></div>
        <div id="sessFiles" class="sess-files hidden" aria-label="Files that go with the message"></div>
        <div id="sessDictate" class="sess-dictate hidden" aria-live="polite"></div>
        <form id="sessBar" class="sbar composer" autocomplete="off">
          <input id="sessPickFiles" type="file" multiple hidden>
          <textarea id="sessText" rows="1" placeholder="Message this session" aria-label="Message for the session's terminal"></textarea>
          <button id="sessAttach" class="attach" type="button" title="Attach files (up to 5, 10 MB each)" aria-label="Attach files"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
          <button class="btn mic hidden" type="button" id="sessMic" aria-pressed="false" aria-label="Dictate">🎤</button>
          <button id="sessSend" class="btn primary" type="submit" title="Send the message and files to the session. Shift+Enter starts a new line.">Send</button>
        </form>
      </div>
    </div>
    <aside class="panel sess-panel hidden" id="sessPanel" aria-label="Side panel">
      <div class="sp-grip" id="spGrip" title="Drag to resize the side panel"></div>
      <div class="sp-tabs" id="spTabs"></div>
      <form class="sp-bar" id="spForm" autocomplete="off">
        <input id="spAddr" placeholder="A web address or a full file path" aria-label="Address">
        <button class="btn" type="button" id="spFindBtn" title="Find words in this tab (Cmd+F or Ctrl+F in the panel)" aria-controls="spFind" aria-expanded="false">Find</button>
        <button class="btn" type="button" id="spReload" title="Load it again">Reload</button>
        <button class="btn" type="button" id="spNew" title="Open it in a new browser tab">Open in a new tab</button>
        <button class="btn" type="button" id="spFull" title="Show it alone in a browser tab of its own, with a link to keep">Open full screen</button>
        <button class="iconbtn" type="button" id="spClose" title="Close the side panel">✕</button>
      </form>
      <div class="sp-find hidden" id="spFind" role="search">
        <input id="spFindQ" type="search" placeholder="Find in this tab" aria-label="Find in this tab" autocomplete="off" enterkeyhint="search">
        <span class="sp-find-n muted" id="spFindN" aria-live="polite"></span>
        <button class="iconbtn" type="button" id="spFindPrev" title="Previous (Shift+Enter)" aria-label="Previous match">↑</button>
        <button class="iconbtn" type="button" id="spFindNext" title="Next (Enter)" aria-label="Next match">↓</button>
        <button class="iconbtn" type="button" id="spFindX" title="Close (Esc)" aria-label="Close find">✕</button>
      </div>
      <div class="sp-body" id="spBody"></div>
    </aside>
  </div>
</section>
