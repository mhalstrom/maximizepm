<!-- The sessions tab of the page (#4656). maxpm serve puts it into index.html, at view: sessions. -->
<section id="tab-sessions" class="hidden">
  <div class="sess-layout" id="sessLayout">
    <aside class="panel sess-side" aria-label="Running sessions">
      <h2 title="Read from each session's transcript">Running sessions</h2>
      <!-- Start an agent and the open session slots (#5102 step 2): here, where the new session shows. -->
      <div id="sessStart" class="sess-start"></div>
      <!-- The You row (#5102 step 1): what waits on you, with a ! badge; it opens the You view. Under it, the session
           that goes through that list with you (#5110: your assistant, a session type of its own). -->
      <div class="slist-mgr slist-you" aria-label="You">
        <div id="sessYouRow"></div>
        <div id="sessAssist" class="slist-rows" aria-label="Your assistant"></div>
      </div>
      <!-- The Artifacts row (#5102 step 3): what all the sessions made; it opens the Artifacts view. -->
      <div id="sessArtsRow" class="slist-arts" aria-label="Artifacts"><div class="srow srow-arts" data-arts="1">
        <div class="srow-main" tabindex="0" role="button" title="What all sessions made or named" aria-label="Artifacts of all sessions">
          <div class="srow-h"><b class="srow-t">Artifacts</b></div><div class="sub">What the sessions made</div></div></div></div>
      <div id="sessMgr" class="slist-mgr" aria-label="Manager"></div>
      <div id="sessExperts" class="slist-mgr slist-experts hidden" aria-label="Experts">
        <div class="slist-h">Experts</div>
        <div id="sessExpertRows" class="slist-rows"></div>
      </div>
      <div id="sessions" class="slist"></div>
      <!-- The foot of the list (#5102 step 2): the ended sessions (read only) and Close N finished (the tmux panes). -->
      <div id="sessEnded" class="slist-ended hidden" aria-label="Ended sessions"></div>
      <div id="sessFoot" class="sess-foot"></div>
    </aside>
    <div class="panel sess-main hidden" id="sessMain">
      <!-- The head (#5115): one row at every width. Left: the name, the agent id, the state as a dot with its word, and
           the item (only when there is one). Right: Items and Artifacts as one quiet tab pair (they open the side panel's
           lists), then one ⋯ menu: Open session, Give work, Settings, the links to Plan, End. -->
      <div class="sess-head">
        <button class="btn" type="button" id="sessBack" title="All running sessions" aria-label="All running sessions">‹<span class="sb-word"> Sessions</span></button>
        <h2 class="sess-h2"><span id="sessName"></span> <span id="sessTitle" class="sid" title="Its agent id (maxpm --as)"></span></h2>
        <span id="sessState" class="sess-st"></span>
        <span id="sessItem" class="sess-item"></span>
        <span class="spacer"></span>
        <span class="sess-lists" role="group" aria-label="Open in the side panel">
          <button class="btn sess-tab" type="button" data-sp-open="items" aria-pressed="false" title="Items it worked on">Items</button><button class="btn sess-tab" type="button" data-sp-open="artifacts" aria-pressed="false" title="Files and pages it made">Artifacts</button><button class="btn sess-tab" type="button" data-sp-browser aria-pressed="false" title="This project's browser">Browser</button>
        </span>
        <span class="sess-more">
          <button class="iconbtn" type="button" id="sessMore" aria-expanded="false" aria-controls="sessMenu" title="Session actions" aria-label="More of this session">⋯</button>
          <div class="sess-menu" id="sessMenu" aria-label="This session">
            <div id="sessMenuItem" class="sess-mgrp sess-mitem"></div>
            <!-- On a phone the head has no room for the tab pair: Items, Artifacts and Browser are rows here (#5402). -->
            <div class="sess-mgrp sess-mlists"><button class="btn sess-ml" type="button" data-sp-open="items">Items</button><button class="btn sess-ml" type="button" data-sp-open="artifacts">Artifacts</button><button class="btn sess-ml" type="button" data-sp-browser>Browser</button></div>
            <div id="sessOpen" class="sess-mgrp"></div>
            <div id="sessGive" class="sess-mgrp give-row"></div>
            <div id="sessPlan" class="sess-mgrp"></div>
          </div>
        </span>
      </div>
      <div id="sessBody" class="sbody"><div id="sessCol" class="chat-col"></div></div>
      <div class="chat-col chat-foot">
        <div id="sessPropose" class="sess-propose hidden" aria-live="polite"></div>
        <div id="sessWait" class="sess-wait hidden"></div>
        <div id="sessBarWhy" class="muted sess-why hidden"></div>
        <div id="sessFiles" class="sess-files hidden" aria-label="Files that go with the message"></div>
        <div id="sessDictate" class="sess-dictate hidden" aria-live="polite"></div>
        <form id="sessBar" class="sbar composer" autocomplete="off"></form>
      </div>
    </div>
    <!-- view: you -->
    <!-- view: artifacts -->
    <aside class="panel sess-panel hidden" id="sessPanel" aria-label="Side panel">
      <div class="sp-grip" id="spGrip" title="Drag to resize the side panel"></div>
      <!-- The tabs and the panel's ✕ share one line: the ✕ never stands alone under the address bar (#5323). -->
      <div class="sp-top"><div class="sp-tabs" id="spTabs"></div>
        <button class="iconbtn" type="button" id="spClose" title="Close the side panel" aria-label="Close the side panel">✕</button></div>
      <form class="sp-bar" id="spForm" autocomplete="off">
        <input id="spAddr" placeholder="Address or path" aria-label="A web address or a full file path">
        <button class="btn" type="button" id="spFindBtn" title="Find in this tab (Cmd+F)" aria-controls="spFind" aria-expanded="false">Find</button>
        <button class="btn" type="button" id="spReload" title="Load it again">Reload</button>
        <button class="btn" type="button" id="spNew" title="Open it in a new browser tab">New tab</button>
        <button class="btn" type="button" id="spFull" title="Open it alone in a browser tab">Full screen</button>
      </form>
      <div class="sp-find hidden" id="spFind" role="search">
        <input id="spFindQ" type="search" placeholder="Find" aria-label="Find in this tab" autocomplete="off" enterkeyhint="search">
        <span class="sp-find-n muted" id="spFindN" aria-live="polite"></span>
        <button class="iconbtn" type="button" id="spFindPrev" title="Previous (Shift+Enter)" aria-label="Previous match">↑</button>
        <button class="iconbtn" type="button" id="spFindNext" title="Next (Enter)" aria-label="Next match">↓</button>
        <button class="iconbtn" type="button" id="spFindX" title="Close (Esc)" aria-label="Close find">✕</button>
      </div>
      <div class="sp-body" id="spBody"></div>
    </aside>
  </div>
</section>
