<!-- The Terminal tab of the page (#4803). maxpm serve puts it into index.html, at view: terminal. -->
<section id="tab-terminal" class="hidden">
  <div class="panel">
    <div class="sh-head" title="A plain shell on the computer that runs MaximizePM, in your home folder: run a command from another computer or your phone. Only a person opens one; each one that opens or closes is in the history.">
      <button class="btn primary" type="button" data-shell-new>Open a terminal</button></div>
    <div id="shellState" class="muted"></div>
    <div id="shellList" class="sh-list"></div>
    <p class="muted sh-note" id="shellNote"></p>
  </div>
</section>
