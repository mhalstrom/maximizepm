<!-- The Artifacts view of the Sessions tab (#4620; a row under You since #5102 step 3, design #4657): what all the
     sessions made or named, also the ended ones. maxpm serve puts it into sessions.html, at view: artifacts. -->
<div class="panel sess-main sess-arts hidden" id="sessArts">
  <div class="sess-head">
    <button class="btn" type="button" id="artsBack" title="All running sessions" aria-label="All running sessions">‹<span class="sb-word"> Sessions</span></button>
    <h2 class="sess-h2" title="What the sessions made or named">Artifacts</h2>
  </div>
  <div class="arts-filter">
    <select id="artSession" title="Session"><option value="">All sessions</option></select>
    <input id="artItem" type="search" placeholder="Item #" title="Only the artifacts of this item">
  </div>
  <div class="arts-body"><div id="artList"></div></div>
</div>
