# Each push to a branch and each pull request: the unit tests only (#4636). They are quick, and they keep the
# promises that break without a sign: Python 3.10 to 3.13 (the standard library differs between them), on Linux
# and macOS. Windows runs maxpm only inside WSL 2, which is Linux (mark 2026-11-12): no Windows job. The wheel
# build and the desktop smoke tests run on a release tag, in desktop-release.yml, before the release builds.
name: tests
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (standard library only)
        run: python -m unittest discover -s tests -t . -v
