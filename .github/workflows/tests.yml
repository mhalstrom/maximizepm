# Each push to a branch and each pull request: the unit tests only (#4636). They are quick, and they keep the
# promises that break without a sign: Python 3.10 to 3.13 (the standard library differs between them), on Linux
# and macOS. Windows runs maxpm only inside WSL 2, which is Linux (mark 2026-11-12): no Windows job. The wheel
# build and the desktop smoke tests run on a release tag, in desktop-release.yml, before the release builds.
#
# The pipeline of MaximizePM (#6119) reads each run of this workflow and the JUnit reports of its test jobs (artifacts
# junit-*). When the person or the manager runs the tests again for a version (maxpm pipeline rerun), MaximizePM starts
# it with workflow_dispatch: maxpm_run names its stage run (the run's name then says 'maxpm run <id>', which links the
# two) and maxpm_rev the commit to test.
name: tests
run-name: ${{ inputs.maxpm_run && format('maxpm run {0}', inputs.maxpm_run) || github.event.head_commit.message || github.event.pull_request.title || 'tests' }}
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      maxpm_run:
        description: "The MaximizePM stage run that started it"
        required: false
      maxpm_rev:
        description: "The commit to test"
        required: false
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.maxpm_rev || '' }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # GitHub runs the deterministic subset (#6504, mark 2026-11-20): real Chrome and latency/timing/process
      # tests run locally, not on shared runners.
      - name: Tests (standard library only)
        env:
          MAXPM_NO_BROWSER: "1"
          MAXPM_SKIP_LOCAL_ONLY: "1"
        run: python tests/junit_run.py report.xml "${{ matrix.os }} py${{ matrix.python }}"
      - name: The JUnit report, for the pipeline of MaximizePM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-${{ matrix.python }}
          path: report.xml
          if-no-files-found: ignore
  # install-standalone.sh on a Linux host with no Python of its own (#5873): the Python of river/python-builds.txt,
  # checked by sha256, and the code of this commit; then the maxpm command runs on a new queue, and a second run
  # keeps the Python it has.
  standalone:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - name: Install with install-standalone.sh, then run maxpm
        run: |
          sh install-standalone.sh --from . --dir "$RUNNER_TEMP/m" --bin-dir "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/maxpm" --version
          MAXPM_DB="$RUNNER_TEMP/q.db" MAXPM_LOCAL=1 "$RUNNER_TEMP/bin/maxpm" --json status > /dev/null
          sh install-standalone.sh --from . --dir "$RUNNER_TEMP/m" --bin-dir "$RUNNER_TEMP/bin" | grep -q 'is current'
