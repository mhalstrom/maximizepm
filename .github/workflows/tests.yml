# Each push to a branch and each pull request: the unit tests only (#4636). They are quick, and they keep the
# promises that break without a sign: Python 3.10 to 3.13 (the standard library differs between them) and the
# Windows paths and process calls (_norm_path, _win_*). The wheel build and the desktop smoke tests run on a
# release tag, in desktop-release.yml, before the release builds.
name: tests
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (standard library only)
        run: python -m unittest discover -s tests -t . -v
  # Windows: maxpm works there too (#273, #274).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: "Tests (standard library, plus tzdata: Windows has no time zone database)"
        run: |
          python -m pip install --quiet tzdata
          python -m unittest discover -s tests -t . -v
