# The desktop app: on a version tag (v0.1.0), build the macOS .dmg files (Apple silicon and Intel) and attach
# them to a GitHub Release for that tag, with the code archive and manifest.json that the app's Update reads (#5601).
# With the five signing secrets (#5615: APPLE_CERT_P12, APPLE_CERT_PASSWORD, APPLE_API_KEY_P8, APPLE_API_KEY_ID,
# APPLE_API_ISSUER; desktop/scripts/signing-secrets.sh sets them) the apps are signed with the Developer ID and the
# hardened runtime, notarized and stapled, and so are the .dmg files. With none of them the apps are signed ad hoc as
# before, and the first open needs Open Anyway in System Settings.
name: desktop-release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish, for example v0.1.0 (it is created if it does not exist)"
        required: true
permissions:
  contents: write
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
jobs:
  # Before the release builds (#4636): the unit tests, and the wheel builds, installs and runs. The desktop smoke
  # test (maxpm serve starts and stops) runs in the mac jobs before their build step.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Without the tests that start a real browser (mark 2026-11-12): they run in tests.yml on each push, and a slow
      # runner must not stop a release.
      - name: Tests (standard library only, without the browser tests)
        env:
          MAXPM_NO_BROWSER: "1"
        run: python -m unittest discover -s tests -t . -v
      - name: Wheel builds and runs
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir dist .
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet dist/*.whl
          MAXPM_DB=/tmp/q.db /tmp/v/bin/maxpm guide | head -1
          MAXPM_DB=/tmp/q.db /tmp/v/bin/maxpm project add demo
  mac:
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Smoke test (maxpm serve starts and stops)
        working-directory: desktop
        run: npm test
      - name: Version from the tag
        working-directory: desktop
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3, not $TAG"; exit 1; }
          npm version --no-git-tag-version --allow-same-version "${TAG#v}"
      - name: The dictation helper (#5107), for Apple silicon and Intel, into river/bin, which the app bundles
        run: |
          # SpeechAnalyzer needs the macOS 26 SDK: the newest Xcode 26 of the runner.
          xc=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$xc" ] && sudo xcode-select -s "$xc"
          mkdir -p river/bin
          swiftc -O -target arm64-apple-macos26.0 river/dictate/main.swift -o "$RUNNER_TEMP/dictate-arm64"
          swiftc -O -target x86_64-apple-macos26.0 river/dictate/main.swift -o "$RUNNER_TEMP/dictate-x64"
          lipo -create "$RUNNER_TEMP/dictate-arm64" "$RUNNER_TEMP/dictate-x64" -output river/bin/maxpm-dictate
          codesign --force --sign - river/bin/maxpm-dictate
          lipo -info river/bin/maxpm-dictate
      - name: Build the .dmg files (signed and notarized with the signing secrets, else signed ad hoc)
        working-directory: desktop
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          n=0
          for v in APPLE_CERT_P12 APPLE_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do [ -n "${!v}" ] && n=$((n+1)); done
          if [ "$n" = 0 ]; then
            echo "no signing secrets: the apps are signed ad hoc"
            echo "SIGNED=0" >> "$GITHUB_ENV"
            npm run dist
            exit 0
          fi
          [ "$n" = 5 ] || { echo "only $n of the 5 signing secrets are set: set all of them (desktop/scripts/signing-secrets.sh) or none"; exit 1; }
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "SIGNED=1" >> "$GITHUB_ENV"
          # electron-builder imports the certificate into a keychain of its own, signs, notarizes and staples.
          CSC_LINK="$RUNNER_TEMP/cert.p12" CSC_KEY_PASSWORD="$APPLE_CERT_PASSWORD" CSC_IDENTITY_AUTO_DISCOVERY=true \
            APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8" npm run dist:signed
          # The .dmg files too, so a person who opens one sees no warning before the app.
          for d in out/*.dmg; do
            xcrun notarytool submit "$d" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
            xcrun stapler staple "$d"
          done
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"
      - name: The apps are signed as a whole (a broken signature makes macOS call the app damaged); signed ones pass Gatekeeper
        working-directory: desktop
        run: |
          for a in out/mac*/"MaximizePM.app"; do
            codesign --verify --deep --strict "$a" && echo "signature OK: $a"
            if [ "$SIGNED" = 1 ]; then
              codesign -dv "$a" 2>&1 | grep -q "^Authority=Developer ID Application" || { echo "not signed with the Developer ID: $a"; exit 1; }
              xcrun stapler validate "$a"
              spctl --assess --type execute -vv "$a"
            fi
          done
          if [ "$SIGNED" = 1 ]; then for d in out/*.dmg; do xcrun stapler validate "$d"; spctl --assess --type open --context context:primary-signature -vv "$d"; done; fi
      - name: The app starts MaximizePM from its own bundle, with its own Python
        working-directory: desktop
        run: |
          MAXPM_DB="$RUNNER_TEMP/q.db" node -e '
            const { startRiver } = require("./server");
            // find: () => null proves the app does not fall back to a Python on the runner.
            startRiver({ riverRoot: process.argv[1], find: () => null }).then(async (r) => { console.log("MaximizePM answers on", r.url, "with", r.child.spawnargs[0]); await r.stop(); })
              .catch((e) => { console.error(e.message); process.exit(1); });' "$PWD/out/mac-arm64/MaximizePM.app/Contents/Resources/river-app"
      # The Update of the app (#5601, river/release.py) downloads this archive: the bin and river that the app carries,
      # taken from the built app, so the dictation helper in it is signed as the app's is (#5615). manifest.json names
      # it with its sha256 and the shell id of these apps.
      - name: The code archive and manifest.json for the app's Update
        run: |
          v="${TAG#v}"
          grep -qx "__version__ = \"$v\"" river/__init__.py || { echo "river/__init__.py does not say version $v"; exit 1; }
          d="$RUNNER_TEMP/code/maximizepm-$v"
          mkdir -p "$d"
          app=desktop/out/mac-arm64/MaximizePM.app/Contents/Resources/river-app
          cp -R "$app/bin" "$d/bin"
          rsync -a --exclude '__pycache__' --exclude '*.pyc' "$app/river" "$d/"
          [ -x "$d/river/bin/maxpm-dictate" ] || { echo "the dictation helper is missing"; exit 1; }
          tar -C "$RUNNER_TEMP/code" -czf "desktop/out/MaximizePM-$v-code.tar.gz" "maximizepm-$v"
          node desktop/scripts/manifest.js "$v" "desktop/out/MaximizePM-$v-code.tar.gz" > desktop/out/manifest.json
          [ "$(jq -r .shell desktop/out/manifest.json)" = "$(cat desktop/build/shell-id.txt)" ] || { echo "the shell id differs from the app's"; exit 1; }
          cat desktop/out/manifest.json
      - name: The code archive passes the start check of an Update, with the app's own Python
        run: |
          v="${TAG#v}"; t="$RUNNER_TEMP/unpack"; mkdir -p "$t"
          tar -C "$t" -xzf "desktop/out/MaximizePM-$v-code.tar.gz"
          py=desktop/out/mac-arm64/MaximizePM.app/Contents/Resources/river-app/python/bin/python3
          PYTHONPATH= "$py" -c 'import sys; sys.path.insert(0, sys.argv[1]); from river import release; why = release.start_check(sys.argv[1], sys.argv[2]); print(why or "start check OK"); sys.exit(1 if why else 0)' "$t/maximizepm-$v" "$v"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            desktop/out/*.dmg
            desktop/out/*-code.tar.gz
            desktop/out/manifest.json
          if-no-files-found: error
  # The x64 .dmg is built on an Apple silicon runner; run it on an Intel Mac before it is published.
  mac-intel:
    needs: mac
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # The browser tests run in tests.yml on each push, not in a release (#5583: on the Intel runner of v0.2.0 a
      # dictation test waited 15 s for words that come in under 1 s on Linux and Apple silicon, and no release was
      # made). This job checks the Intel build.
      - name: Tests on Intel (standard library only, without the browser tests)
        env:
          MAXPM_NO_BROWSER: "1"
        run: python -m unittest discover -s tests -t .
      - uses: actions/download-artifact@v4
        with:
          name: mac
          path: dmg
      - name: The Intel app from the .dmg is signed and starts MaximizePM with its own Python
        working-directory: desktop
        run: |
          [ "$(uname -m)" = x86_64 ] || { echo "not an Intel runner: $(uname -m)"; exit 1; }
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/app" ../dmg/*-x64.dmg
          app="$RUNNER_TEMP/app/MaximizePM.app"
          codesign --verify --deep --strict "$app" && echo "signature OK"
          if codesign -dv "$app" 2>&1 | grep -q "^Authority=Developer ID Application"; then
            xcrun stapler validate "$app" && spctl --assess --type execute -vv "$app"
          fi
          file "$app/Contents/MacOS/MaximizePM" "$app/Contents/Resources/river-app/python/bin/python3"
          MAXPM_DB="$RUNNER_TEMP/q.db" node -e '
            const { startRiver } = require("./server");
            startRiver({ riverRoot: process.argv[1], find: () => null }).then(async (r) => { console.log("MaximizePM answers on", r.url, "with", r.child.spawnargs[0]); await r.stop(); })
              .catch((e) => { console.error(e.message); process.exit(1); });' "$app/Contents/Resources/river-app"
          hdiutil detach "$RUNNER_TEMP/app"
  publish:
    needs: [mac, mac-intel]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: desktop/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # A re-run of failed jobs (run attempt 2 and later) gets HTTP 403 'Resource not accessible by integration' when it
      # creates the release, with the same contents: write token (v0.1.4 and v1.0.0); every first attempt published
      # (#5606). After a failed build, start a new run for the tag instead of a re-run:
      #   gh workflow run desktop-release.yml -R mhalstrom/maximizepm -f tag=<tag>
      - name: Publish the GitHub Release
        env:
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          ls -l dist
          # The notes: desktop/release-notes.md, with {TAG} and {VERSION} filled in.
          sed -e "s/{TAG}/${TAG}/g" -e "s/{VERSION}/${TAG#v}/g" desktop/release-notes.md > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          elif ! gh release create "$TAG" dist/* --title "MaximizePM ${TAG}" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA" -R "$GITHUB_REPOSITORY"; then
            if [ "$ATTEMPT" -gt 1 ]; then
              echo "::error::A re-run (attempt $ATTEMPT) cannot create the release. Start a new run for the tag: gh workflow run desktop-release.yml -R $GITHUB_REPOSITORY -f tag=$TAG"
            fi
            exit 1
          fi
